[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "groq",
    "python-dotenv",
    "pydantic",
    "pydantic-settings",
    "supabase",
    "sentence-transformers",
    "presidio-analyzer",
    "presidio-anonymizer",
]

[tool.setuptools.packages.find]
include = ["ai_engine*"]